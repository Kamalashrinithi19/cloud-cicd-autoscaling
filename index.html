
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud CI/CD Auto Scaling</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fb;
            color: #263238;
            text-align: center;
            padding: 70px 16px;
        }
        .card {
            max-width: 650px;
            margin: auto;
            padding: 35px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 5px 20px #0001;
        }
        h1 { color: #1769aa; }
        .status { color: #16845b; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Cloud Infrastructure with CI/CD</h1>
        <p class="status">Application is running successfully!</p>
        <p>This application is deployed automatically using AWS CodePipeline.</p>
        <p>Traffic is distributed by an Application Load Balancer.</p>
        <p>EC2 capacity is managed by an Auto Scaling Group.</p>
        <p><strong>Application version: v1</strong></p>
    </div>
</body>
</html>
